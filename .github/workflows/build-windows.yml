name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pynput pyinstaller setuptools

      - name: Build Standalone Windows Executable
        run: |
          pyinstaller --name WhisperTeX --onefile --console whispertex/cli.py

      - name: Prepare Windows Release Package
        shell: bash
        run: |
          mkdir -p dist_windows/WhisperTeX
          cp dist/WhisperTeX.exe dist_windows/WhisperTeX/
          cp scripts/windows/run_whispertex.bat dist_windows/WhisperTeX/
          cp scripts/windows/install_whispertex.ps1 dist_windows/WhisperTeX/
          cp scripts/windows/README_WINDOWS.txt dist_windows/WhisperTeX/
          cd dist_windows
          7z a -tzip ../WhisperTeX-windows-x64.zip WhisperTeX/

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperTeX-windows-x64
          path: WhisperTeX-windows-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WhisperTeX-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
